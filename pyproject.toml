[project]
name = "fertility_suite"
authors = [
	{ name = "RGoodEffect" }
]
description = "Fertility, IVF, Embryology and Embryo Bank Management Suite for ERPNext Healthcare"
requires-python = ">=3.12"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
# none beyond frappe/erpnext/healthcare, which are installed as bench apps

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
	"F",
	"E",
	"W",
	"I",
]
ignore = ["E501", "W191", "E101"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
